networks:
  proxy:
    external: true
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ftrah_web
    restart: unless-stopped
    env_file:
    - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
    - proxy
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.ftrah-http.entrypoints=http
    - traefik.http.routers.ftrah-http.rule=Host(`ftrah.com`)
    - traefik.http.routers.ftrah-http.middlewares=https-redirectscheme@file
    - traefik.http.routers.ftrah-https.entrypoints=https
    - traefik.http.routers.ftrah-https.rule=Host(`ftrah.com`)
    - traefik.http.routers.ftrah-https.middlewares=default-security-headers@file
    - traefik.http.routers.ftrah-https.tls=true
    - traefik.http.routers.ftrah-https.tls.certresolver=le
    - traefik.http.services.ftrah.loadbalancer.server.port=3000
    image: local/node-security/ftrah-web:22.23.4-20261024
